[project]
name = "jev-ultrafast-computer-use"
version = "0.3.0"
description = "Supervised Jev browser use for Codex and Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "jev-ultrafast",
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[project.scripts]
jev-computer-use-mcp = "jev_ultrafast_computer_use.mcp_server:main"

[tool.uv.sources]
jev-ultrafast = { git = "https://github.com/browser-use/jev-ultrafast.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ultrafast_computer_use"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
